name: Check use case format sync

on:
  push:
    paths:
      - "product-management/skills/use-case-uml/references/**"
      - "product-management/skills/use-case-discovery/references/**"
      - "use-cases/**"
      - "scripts/check-use-case-sync.sh"
  pull_request:
    paths:
      - "product-management/skills/use-case-uml/references/**"
      - "product-management/skills/use-case-discovery/references/**"
      - "use-cases/**"
      - "scripts/check-use-case-sync.sh"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check-use-case-sync.sh
